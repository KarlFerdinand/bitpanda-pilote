# =====================================================================
#  Bitpanda Pilote — réglages
#  Modifiable directement sur GitHub (crayon ✏️ en haut du fichier).
#  Les valeurs par défaut sont des exemples de départ, pas des conseils
#  d'investissement : vérifie-les et adapte-les à ta situation.
# =====================================================================

# Interrupteur général : false = le bot ne fait plus rien (ni achat ni vente).
enabled: true

# paper = simulation (aucun ordre réel, argent fictif)
# live  = ordres réels sur Bitpanda. Exige AUSSI la variable GitHub
#         LIVE_TRADING = true, la clé API et un plafond journalier Bitpanda.
mode: paper

budget:
  weekly_eur: 50                # crédité chaque lundi (ou variable GitHub WEEKLY_BUDGET_EUR)
  max_reserve_weeks: 4          # le non-dépensé s'accumule, au plus 4 semaines de budget
  min_weekly_invest_pct: 0.4    # le vendredi, au moins 40 % du budget de la semaine est investi
                                # sur l'ETF « socle » (0 = désactivé)
  max_daily_pct_of_weekly: 1.0  # au plus 1 semaine de budget dépensée sur une seule journée
  min_order_eur: 10             # en dessous, le bot attend d'avoir accumulé assez

# Poches. Le total doit faire 1.
# Choix du 26/10/2026 : plus aucun achat de crypto. Tes cryptos existantes ne sont jamais
# vendues par le bot ; elles restent simplement comptées dans le total de ton compte.
allocation:
  etf: 0.70                     # 70 % ETF solides (le cœur diversifié)
  actions: 0.30                 # 30 % actions : IA, luxe, pharma, tech, opportunités
  crypto: 0.0                   # 0 % : aucun achat crypto
  max:                          # plafonds durs : au-delà, plus aucun achat dans la poche
    etf: 1.0
    actions: 0.40
    crypto: 0.0
  rebalance_band: 0.05          # tolérance avant de réorienter les achats
  scope: account                # account = répartir en tenant compte de TOUT ton compte Bitpanda
                                # (lecture seule, rien n'est vendu) ; bot = seulement ce que le bot achète

signals:
  sma_short: 50                 # moyenne mobile courte (jours de cotation)
  sma_long: 200                 # moyenne mobile longue = juge de paix de la tendance
  rsi_period: 14
  rsi_dip: 35                   # RSI bas dans une tendance haussière = repli intéressant
  rsi_hot: 75                   # RSI haut = surchauffe, on lève le pied
  momentum_windows: [21, 63, 126]   # ~1, 3 et 6 mois
  risk_adjusted: [actions]      # poches classées par momentum ÷ volatilité (évite de ne
                                # choisir que les titres les plus nerveux)
  analysts:                     # consensus des analystes (source : Yahoo Finance), poche actions
    enabled: true
    max_recommendation: 2.5     # échelle 1 = achat fort … 5 = vente ; au-delà de 2,5, pas d'achat
    min_analysts: 5             # au moins 5 analystes suivent la valeur
    min_upside: 0.0             # objectif de cours moyen au-dessus du cours actuel
    upside_weight: 0.5          # petit bonus de classement selon le potentiel annoncé
  pullback_pct: 0.08            # recul depuis le plus haut 3 mois jugé « opportunité »
  top_n:                        # nb max de lignes achetées le même jour
    etf: 2
    actions: 2
    crypto: 1
  vix_fear: 28                  # VIX au-dessus = peur sur les actions
  vix_calm: 15                  # VIX en dessous = excès de confiance possible
  crypto_fear: 25               # indice Fear & Greed crypto
  crypto_greed: 75
  max_multiplier: 2.5           # un jour d'opportunité peut acheter au plus 2,5× le rythme normal

exits:                          # le socle (core: true) n'est jamais vendu par le bot
  min_hold_days: 14             # pas de revente avant 14 jours (évite les frais d'allers-retours)
  trailing_stop:                # vend si -X % depuis le plus haut atteint ET sous la moyenne 50 j
    etf: 0.15
    actions: 0.20
    crypto: 0.25
  trend_break_pct: 0.03         # vend si 3 % sous la moyenne 200 j et moyenne 50 j < 200 j
  take_profit_gain: 0.30        # à +30 % de plus-value…
  take_profit_rsi: 75           # …et en surchauffe…
  take_profit_trim: 0.25        # …on encaisse 25 % de la ligne
  take_profit_cooldown_days: 30

risk:
  max_position_pct:             # poids max d'une ligne (le socle est exempté)
    etf: 0.40
    actions: 0.08               # une action seule ne dépasse pas 8 % du portefeuille
    crypto: 0.40
  max_theme_pct: 0.15           # un thème d'actions (IA, luxe…) ne dépasse pas 15 % du portefeuille
  caps_min_portfolio_eur: 300   # plafonds appliqués à partir de 300 € investis

execution:
  max_orders_per_run: 6
  max_price_deviation: 0.03     # refuse un devis Bitpanda à plus de 3 % du prix de référence
  max_fee_pct: 0.025            # refuse un devis dont les frais dépassent 2,5 %
  daily_sell_limit_eur: 2000    # plafond de ventes posé sur la clé API Bitpanda
  paper_fee_pct:                # frais estimés en simulation
    etf: 0.005
    actions: 0.005
    crypto: 0.015

agent:                          # veille d'actualité par Claude (optionnelle)
  enabled: true                 # ne s'active que si le secret ANTHROPIC_API_KEY existe
  model: claude-haiku-5-5
  max_searches: 5
  weight: 0.2                   # influence max : ±20 % sur le montant du jour, jamais de vente

